# Updated Based on Allen Baum's Schema Guidance
# Updated: August 1, 2026
# Focus: Parameter identification using Allen's three schema patterns

---

# EXAMPLE 1: Enum Schema - Discrete Values (1-64 items)
kind: parameter
name: CACHE_BLOCK_SIZE
long_name: "Cache Block Size (in bytes)"
description: |
  WARL field defining cache block size.
  Legal values: implementations choose from standard sizes.
  Part of parameter definition: legal-value set + illegal-to-legal mapping.

type: enum
legal_values: [32, 64, 128, 256, 512, 1024, 2048, 4096]
schema_pattern: "enum (bitmask encoding: bit position = size selector)"

spec_reference:
  manual: "RISC-V Unprivileged ISA Manual"
  section: "src/unpriv/cmo.adoc"
  excerpt: "The capacity and organization of a cache and the size of a cache block are both implementation-specific"

confidence: HIGH
rationale: |
  Allen Baum: "Focus is primarily to find parameters. WARL are obvious cases."
  This is an obvious WARL field. Implementations choose which sizes to support.
  Legal-value set is clearly enumerable (8 standard values).

---

# EXAMPLE 2: Mask:Value{;State} Schema - Conditional Values
kind: parameter
name: HGATP_MODE
long_name: "Hypervisor Guest Address Translation Mode"
description: |
  Encodes valid virtual-memory translation modes for guest VMs.
  Legal values constrained by nested-subset rule:
  - If SV48 is legal, SV39 must be legal
  - If SV57 is legal, SV48 and SV39 must be legal
  - Cannot be superset of SATP (hypervisor constraint)

type: enum_constrained
schema_pattern: "mask:value{;state} - 16-bit bitmask enum"
legal_values: [BARE, SV39, SV39+SV48, SV39+SV48+SV57]
constraint: "nested_subset"
conditional_on: "architecture state (RV32 vs RV64)"

spec_reference:
  manual: "RISC-V Privileged ISA Manual"
  section: "hgatp.yaml"
  note: "Constraint logic requires expert interpretation"

confidence: MEDIUM
classification: "CONDITIONAL_PARAMETER"
rationale: |
  Allen Baum: "In this case, I believe the spec says that for a valid SV value, 
  the encodings of all the smaller ones must also be legal."
  
  This is parameter identification: hgatp.MODE IS a legal-value parameter.
  The exact constraint logic (nested subsets, SATP comparison) requires 
  expert review and formal specification.
  
  Do NOT attempt to extract all valid combinations.
  DO identify: this is a parameter + name it + flag constraint type.

---

# EXAMPLE 3: Conditional WARL - RdOnly0 Case
kind: parameter
name: EXAMPLE_CONDITIONAL_WARL
long_name: "Field That Becomes RdOnly0 Under Conditions"
description: |
  Demonstrates conditional WARL pattern from Allen's guidance:
  
  Normal state (condition not met):
  - Field is RW (read-write)
  - Legal values: {0, 1}
  
  Conditional state (extension/feature enabled):
  - Field becomes RdOnly0
  - Legal values: {0} only
  - Write attempts have no effect (value is ignored)

type: enum_conditional
schema_pattern: "mask:value{;state}"
conditions:
  - state: "base (feature not implemented)"
    legal_values: [0, 1]
    behavior: "RW"
  - state: "feature implemented"
    legal_values: [0]
    behavior: "RdOnly0"

depends_on: "Feature or extension implementation state"

confidence: MEDIUM
classification: "CONDITIONAL_WARL"
rationale: |
  Allen Baum: "Sometimes a WARL field isn't explicitly labelled WARL, but 
  become one under certain contexts... that makes this bit functionally WARL, 
  and thus needs a parameter value."
  
  Key insight: Not all WARL fields are explicitly labeled.
  This is a parameter because legal-value set changes based on state.
  Encoding: mask:value{;state} with explicit condition.

---

# SCHEMA PATTERNS REFERENCE

PATTERN 1: Simple Enum (1-64 values)
- Used for: Discrete choice fields with fixed legal set
- Encoding: List values or bitmask (bit position = value)
- Example: CACHE_BLOCK_SIZE with 8 standard sizes

PATTERN 2: Mask:Value{;State} (Conditional)
- Used for: Legal set depends on architectural state
- Encoding: Bitmask + state condition description
- Example: HGATP_MODE (nested-subset constraint)
- Example: RdOnly0 fields (RW vs RO based on extension)

PATTERN 3: Range_Hi:Range_Lo (Wide Addresses)
- Used for: Fields wider than 64 bits
- Encoding: Upper and lower bounds (instead of full array)
- Reason: 2^57 element array is impractical
- Example: Address translation fields on RV128

---

WHAT FALL 2026 SHOULD FOCUS ON

1. IDENTIFY: Which fields are parameters?
2. CLASSIFY: Which schema pattern applies?
3. VALIDATE: Expert review for undecidable cases

Do NOT try to extract constraint combinations.
Do NOT claim 100% automation on complex cases.
Do focus on accuracy over completeness.

Allen Baum: "If we have to classify something by hand for 18 undecidable cases, 
I think that level of effort is completely in the noise."

Manual review is acceptable. Build good identification first.
