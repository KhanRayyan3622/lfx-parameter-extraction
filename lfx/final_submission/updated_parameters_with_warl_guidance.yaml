kind: parameter
name: CACHE_CAPACITY
long_name: "Cache Capacity (in bytes)"
description: |
  Total cache capacity in bytes. Different implementations choose different capacities.
  
  NOTE: Based on research from GitHub #2053 and Allen's guidance:
  Need to distinguish: "implementation-chosen" vs "discoverable"
  
  Per Allen: WARL parameter includes legal values + illegal-to-legal mapping.
  Capacity is labeled implementation-specific, but need CSR-context validation.

type: integer
unit: bytes
minimum: 1
maximum: 18446744073709551615

warl_behavior: true
implementation_chosen: true

spec_reference:
  manual: "RISC-V Unprivileged ISA Manual"
  section: "src/unpriv/cmo.adoc"

definedBy:
  extension:
    anyOf:
      - name: Zicbom

confidence: MEDIUM
rationale: |
  Labeled implementation-specific, but need Layer 2 CSR-context validation:
  Is capacity truly a parameter (implementation chooses which to test),
  or just discoverable (implementations have capacity, not choosing it)?
  
  GitHub #2053 research: "discoverability ≠ ISA parameter"
  Allen's guidance: Focus on obvious parameters (WARL), surface edge cases for review.

---

NOTES ON CONDITIONAL PARAMETERS (from Allen's guidance):

When a field's behavior changes based on context:
1. Must exist a parameter describing the context
2. Parameter could be extension, other parameter value, other WARL field value
3. Field becomes functionally WARL (legal set changes by context)
4. May not be explicitly labeled WARL in spec
5. Requires naming each condition separately
6. Document circumstances that apply to each condition

Example from Allen:
"a RW field may become RdOnly0 [under certain extensions]"
→ Parameter needed: FIELD_RW_CONDITION or similar
→ Describes: which extensions make field RdOnly0
→ Essentially WARL (set of legal values changes), even if not labeled
→ Could have no effect on operation (value is ignored), just testing verification
