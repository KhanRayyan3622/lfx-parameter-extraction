# Updated Parameter Extraction Based on Allen Baum & titoatwork Research
# Updated: July 31 - August 1, 2026
# Source: GitHub issue #2251, Allen Baum feedback, titoatwork measurements

---

# DECIDABLE CASE #1: Flat Schema Pattern
kind: parameter
name: CACHE_BLOCK_SIZE
long_name: "Cache Block Size (in bytes)"
description: |
  WARL field that defines observable cache block size.
  Represents both legal values and illegal-to-legal mapping.
  Flat case: single parameter, direct schema pattern (type: array + items.enum).

type: enum
unit: bytes
legal_values: [32, 64, 128, 256, 512, 1024, 2048, 4096]

warl_behavior: true
idl_pattern: |
  Pattern recognized in current UDB:
  - type(): $array_size(CACHE_BLOCK_SIZES) determines RO/RW
  - sw_write(): $array_includes?(CACHE_BLOCK_SIZES, value) validates legal values

spec_reference:
  manual: "RISC-V Unprivileged ISA Manual"
  section: "src/unpriv/cmo.adoc"
  excerpt: "The capacity and organization of a cache and the size of a cache block are both implementation-specific"

definedBy:
  extension:
    anyOf:
      - name: Zicbom
      - name: Zicbop
      - name: Zicboz

confidence: HIGH
classification: DECIDABLE_FLAT
rationale: |
  Allen Baum: "If something is WARL, it is a parameter"
  This is a flat case: legal values defined by single parameter (CACHE_BLOCK_SIZES)
  IDL already uses $array_includes? pattern (decidable)
  Belongs in 9-case decidable subset (or descendants from migration #2090)

