# DECIDABLE CASE #2: Cardinality-Based Writability
kind: parameter
name: MSTATUS_FS_LEGAL_VALUES
long_name: "MSTATUS.FS Legal Values"
description: |
  Legal value set for MSTATUS.FS field (floating-point state).
  FLAT case: uses $array_size for RO/RW determination.
  
  From titoatwork measurements:
  - FS field does NOT say WARL in description
  - But schema uses $array_includes?(MSTATUS_FS_LEGAL_VALUES) on write
  - This is decidable flat pattern

type: array
items:
  type: integer
  enum: [0, 1, 2, 3]

warl_behavior: true
idl_pattern: |
  type(): $array_size(MSTATUS_FS_LEGAL_VALUES) determines RO/RW
  sw_write(): $array_includes?(MSTATUS_FS_LEGAL_VALUES, value) validates
  reset_value(): Determined by implementation choice

confidence: HIGH
classification: DECIDABLE_FLAT
rationale: |
  One of 9 parameters identified by titoatwork (exact list provided)
  Flat schema: array+items.enum with direct IDL reference
  Legal set depends on single parameter source (itself)
  No multi-parameter dependencies
  Belongs in decidable subset

