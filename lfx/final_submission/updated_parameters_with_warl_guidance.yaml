# CONDITIONAL CASE: Multi-Parameter Dependency (UNDECIDABLE)
kind: parameter
name: HGATP_MODE_CONDITIONAL
long_name: "HGATP.MODE - Conditional Legal Set (Multi-Parameter Source)"
description: |
  CONDITIONAL CASE showing complexity that cannot be automated with simple schema shape test.
  
  Legal value set for HGATP.MODE depends on 5 DIFFERENT SOURCES:
  - GSTAGE_MODE_BARE (boolean parameter)
  - SV39X4_TRANSLATION (boolean parameter)
  - SV48X4_TRANSLATION (boolean parameter)
  - SV57X4_TRANSLATION (boolean parameter)
  - SV64X4_TRANSLATION (boolean parameter)
  
  For each combination of these 5 booleans, different legal values allowed.
  IDL: sw_write returns UNDEFINED_LEGAL_DETERMINISTIC unless matching parameter set

type: conditional_multi_parameter
condition_sources:
  - parameter: GSTAGE_MODE_BARE
    role: "When set, enables Bare mode"
  - parameter: SV39X4_TRANSLATION
    role: "When set, enables SV39x4 translation mode"
  - parameter: SV48X4_TRANSLATION
    role: "When set, enables SV48x4 translation mode"
  - parameter: SV57X4_TRANSLATION
    role: "When set, enables SV57x4 translation mode"
  - parameter: SV64X4_TRANSLATION
    role: "When set, enables SV64x4 translation mode"

idl_pattern: |
  sw_write(write_value):
    if GSTAGE_MODE_BARE:
      return 0  # Bare mode allowed
    if SV39X4_TRANSLATION:
      return 8  # SV39x4 encoding allowed
    if SV48X4_TRANSLATION:
      return 9  # SV48x4 encoding allowed
    if SV57X4_TRANSLATION:
      return 10 # SV57x4 encoding allowed
    if SV64X4_TRANSLATION:
      return 11 # SV64x4 encoding allowed
    return UNDEFINED_LEGAL_DETERMINISTIC  # No valid mode available

confidence: MEDIUM
classification: UNDECIDABLE_CONDITIONAL
rationale: |
  Allen Baum: "The set of legal values of a WARL field can change depending on 
              other architectural state or parameters"
  
  This is example case: legal set depends on 5 other boolean parameters
  One items.enum cannot express sets assembled from multiple parameters
  Schema shape test MISSES this case (would incorrectly classify as flat)
  
  Requires multi-parameter orchestration logic (beyond simple schema validation)
  Worth flagging for expert review + dependency analysis
  Manual classification faster than complex automation

---

# CONDITIONAL CASE: Parameter-Linked Writability (UNDECIDABLE)
kind: parameter
name: JVT_MODE_CONDITIONAL
long_name: "JVT.MODE - Parameter-Linked Writability"
description: |
  CONDITIONAL CASE: writability depends on JVT_READ_ONLY parameter.
  
  When JVT_READ_ONLY is set:
  - Field becomes effectively read-only (RdOnly0)
  - Only legal value: 0
  - Write attempts raise IllegalInstruction
  
  When JVT_READ_ONLY is not set:
  - Field is writable (RW)
  - Legal values: 0
  - Can set value to 0 (only option anyway)

type: conditional_single_parameter
condition_source: JVT_READ_ONLY
behavior_change: "Writability changes (RW vs RdOnly0), not legal-value cardinality"

idl_pattern: |
  type(): JVT_READ_ONLY ? RO : RW
  sw_write(): 
    if JVT_READ_ONLY || (csr_value.MODE != 0):
      raise IllegalInstruction
    csr_value.MODE = 0

confidence: MEDIUM
classification: UNDECIDABLE_CONDITIONAL
rationale: |
  titoatwork: "jvt.MODE is param-linked but not in that multi-value pattern"
  
  This is not about legal value set size (cardinality test).
  This is about writability (RO vs RW) controlled by parameter.
  Mode-linked: legal set is always {0}, but writability changes
  
  Schema shape test would miss this (no array+items.enum pattern)
  Requires understanding of JVT_READ_ONLY parameter state
  Worth flagging for expert review

---

SUMMARY FOR FALL 2026:

Decidable Cases (9 + descendants from #2090 rewrite):
✓ Can implement full validation
✓ Schema patterns already present in IDL
✓ Flat dependencies (single parameter source)
✓ Can measure precision/recall reliably

Undecidable Cases (multi-parameter dependencies):
⚠️ Surface for expert review instead of automation
⚠️ Flag all dependency sources
⚠️ Let expert determine classification
⚠️ Allen: "That level of effort is completely in the noise"

Non-Cases (custom use, no standard enumeration):
✗ Reject correctly (e.g., CUSTOM WARL bits)
✗ No parameter to enumerate

This narrower scope is more defensible and achievable.
